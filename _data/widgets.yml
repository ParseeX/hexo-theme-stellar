# 您可以在这里创建属于自己的侧边栏组件库，在需要的位置放置自己的组件
# layout即组件布局，支持自定义的有：
# - markdown: 渲染 md 文本
#

ghrepo:
  layout: ghrepo
related:
  layout: related

ghissues:
  layout: ghissues
  title: # Recent Issues
  limit: 3 # 显示的issues最大数量
  labels: # 过滤只显示具有某些标签的issues

# 将其覆盖设置为空，可删除一个默认组件，例如 welcome:
welcome:
  layout: markdown
  title:
  content: |
    <style>
    .welcome-card {
      line-height: 1.65;
      font-size: 0.95rem;
    }

    .welcome-card p {
      margin: 0.35rem 0;
    }

    #welcome-location {
      color: pink;
      font-weight: 700;
    }

    #welcome-ip {
      color: orange;
    }
    </style>

    <div class="welcome-card">
      <p>
        欢迎 <span id="welcome-location">远方</span> 的小伙伴访问我的主页
      </p>
      <p>
        您的IP：<span id="welcome-ip">获取中...</span>
      </p>
    </div>

    <script>
    window.showWelcomeLocation = function(res) {
      var locationEl = document.getElementById('welcome-location');
      var ipEl = document.getElementById('welcome-ip');

      if (!locationEl || !ipEl) return;

      if (!res || res.status !== 0 || !res.result) {
        locationEl.textContent = '远方';
        ipEl.textContent = '获取失败';
        return;
      }

      var ad = res.result.ad_info || {};
      var ip = res.result.ip || '';

      var nation = ad.nation || '';
      var province = ad.province || '';
      var city = ad.city || '';

      var locationText = '';

      if (nation === '中国') {
        locationText = [province, city].filter(Boolean).join('');
      } else {
        locationText = [nation, province, city].filter(Boolean).join('');
      }

      locationEl.textContent = locationText || '远方';
      ipEl.textContent = maskIp(ip);
    };

    function maskIp(ip) {
      if (!ip) return '未知';
      if (ip.indexOf('.') !== -1) {
        return ip.replace(/\.\d+$/, '.***');
      }
      return ip.slice(0, 8) + '...';
    }

    (function() {
      var key = 'NTYBZ-U5ZC7-SANXS-HVKJB-SUUH7-XOFPY';

      var script = document.createElement('script');
      script.src =
        'https://apis.map.qq.com/ws/location/v1/ip?key=' +
        encodeURIComponent(key) +
        '&output=jsonp&callback=showWelcomeLocation';

      document.body.appendChild(script);
    })();
    </script>
# Recent update
recent:
  layout: recent
  rss: # /atom.xml # npm i hexo-generator-feed
  limit: 10 # Count of posts

# 页面树（与当前页面强关联的上下篇文章列表）
tree:
  layout: tree

# 本文目录（当前页面内各级标题列表）
toc:
  layout: toc
  list_number: false
  min_depth: 1
  max_depth: 6
  collapse: false # true / false / auto
  # 编辑本文按钮
  edit_this_page: # 从开头开始匹配替换
    '_posts/': # https://github.com/xaoxuu/xaoxuu.com/blob/main/source/_posts/
    'wiki/stellar/': https://github.com/xaoxuu/hexo-theme-stellar-docs/blob/main/

# GitHub 用户信息
ghuser:
  layout: ghuser
  username: ParseeX # your github login username
  avatar: true # show avatar or not

# 本文作者组件，需要先配置作者信息: authors.yml
author:
  layout: author
  avatar: true

# 标签云组件
tagcloud:
  layout: tagcloud
  title: 标签云
  # 标签云配置
  min_font: 12
  max_font: 24
  amount: 100
  orderby: name
  order: 1 # 1, sac 升序；-1, desc 降序
  color: false # 使用颜色
  start_color: # 开始的颜色。您可使用十六进位值（#b700ff），rgba（rgba(183, 0, 255, 1)），hsla（hsla(283, 100%, 50%, 1)）或 颜色关键字。此变量仅在 color 参数开启时才有用。
  end_color: # 结束的颜色。您可使用十六进位值（#b700ff），rgba（rgba(183, 0, 255, 1)），hsla（hsla(283, 100%, 50%, 1)）或 颜色关键字。此变量仅在 color 参数开启时才有用。
  show_count: false # 显示每个标签的文章总数

timeline:
  layout: timeline
  title: 近期动态
  api: # https://api.github.com/repos/xaoxuu/hexo-theme-stellar/issues
  user: # 默认显示所有人的数据，设置名称可过滤为仅显示某人的数据，多个名称用英文逗号隔开，不要加空格
  limit: # 默认通过 api 上增加 per_page 来设置，如果是友链朋友圈，可通过这个设置数量

latest_comment:
  layout: timeline
  title: 最新评论
  api: # 参照文档获取服务对应的api
  type: # 选择评论服务
  limit: 16 # 限制获取数量

tagtree:
  layout: tagtree
  expand_all: false # 是否展开所有节点
  expand_active: true # 是否展开当前节点
  show_tagcon: true # 是否显示标签 icon
